name: Reproduce and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  parquet-and-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.txt
      - run: python lab.py parquet
      - run: python scripts/index_results.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/parquet.test.mjs
      - run: python scripts/verify_resources.py
      - run: python scripts/build_site.py && python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with: {name: parquet-and-site, path: 'results/parquet.json'}
  integration:
    strategy:
      fail-fast: false
      matrix: {profile: [hdfs, database]}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '11'}
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap.py ${{ matrix.profile }}
      - run: python lab.py ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-evidence
          path: results/${{ matrix.profile }}.json
  iceberg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-iceberg.txt
      - run: python lab.py iceberg
      - run: python scripts/validate_iceberg.py results/iceberg.json
      - run: python scripts/index_results.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with: {name: iceberg-evidence, path: 'results/iceberg.json'}
